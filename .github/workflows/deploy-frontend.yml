name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds the Vite app and publishes it to the existing Cloudflare Pages project
# (same URL as today). The committed .env supplihes the VITE_* build vars, so the
# only repository secrets needed are the Cloudflare credentials below.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fairmeet-2x6 --branch=main
