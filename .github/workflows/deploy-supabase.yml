name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: ntdxzuochwwrdezfrwuq

jobs:
  # Edge functions are safe to deploy automatically on every merge to main.
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  # Migrations run as a separate job so a failure here never blocks function
  # deploys. NOTE: the remote migration history was created out-of-band and its
  # versions do not match the repo's migration filenames. `supabase db push`
  # will fail until the history is repaired once with:
  #   supabase migration repair --status applied <remote_version> ...
  # Until then this job is expected to no-op/fail; functions still deploy above.
  push-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"
